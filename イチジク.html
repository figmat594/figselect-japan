<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FigSelect Japan</title><style>
body{margin:0;background:#f6f4ef;color:#292720;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{padding:26px 18px;background:#3f2630;color:#fff}header h1{margin:0 0 6px;font-size:25px}header p{margin:0;opacity:.85}
main{max-width:1100px;margin:auto;padding:18px}.controls{background:#fff;padding:16px;border:1px solid #e6e0d6;border-radius:16px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px}input,select,button{font:inherit;padding:10px;border:1px solid #d8d1c6;border-radius:10px}button{background:#6b3f52;color:#fff;cursor:pointer}
.stats{margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e6e0d6;border-radius:16px;padding:16px;cursor:pointer}.card h2{font-size:19px;margin:0 0 3px}.alias{font-size:12px;color:#777}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.badge{font-size:12px;padding:4px 8px;background:#f0ebe4;border-radius:999px}
.score{font-size:13px;margin:5px 0}.note{font-size:13px;line-height:1.55;color:#5d584f}.bar{height:7px;background:#eee8df;border-radius:99px}.fill{height:100%;background:#6b3f52}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.dialog{background:#fff;max-width:700px;width:100%;max-height:90vh;overflow:auto;border-radius:18px;padding:20px}.close{float:right;background:#eee;color:#333}
.row{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #e6e0d6}footer{padding:25px 0;color:#777;font-size:12px;line-height:1.6}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>FigSelect Japan</h1><p>イチジク品種を「希少性 × 育てやすさ × 市場性」で比較する試作データベース</p></header>
<main><section class="controls"><div class="filters">
<input id="q" placeholder="品種名・別名で検索"><select id="season"><option value="">収穫時期：すべて</option><option>早生</option><option>中生</option><option>晩生</option></select>
<select id="color"><option value="">色：すべて</option><option>黒</option><option>紫</option><option>緑</option><option>黄</option><option>赤</option></select>
<select id="sort"><option value="commercial">商業ポテンシャル順</option><option value="rarity">希少性順</option><option value="ease">育てやすさ順</option><option value="demand">市場需要順</option><option value="name">名前順</option></select></div>
<button onclick="resetFilters()">条件をリセット</button></section>
<div class="stats"><b id="count">0</b> 品種を表示　｜ ★5＝高評価　｜ 信頼度 A/B/C</div><section id="grid" class="grid"></section>
<footer><b>試作版の注意</b><br>★評価はアプリ設計用の仮スコアです。特に希少性・市場需要・雨耐性は地域、流通経路、系統で変動します。本番版では各項目に「出典・更新日・実測値・信頼度」を紐付けます。</footer></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><button class="close" onclick="closeModal()">閉じる</button><div id="detail"></div></div></div>
<script>
const DATA=[{"name": "桝井ドーフィン", "alias": "Masui Dauphine", "color": "紫褐色", "season": "中生", "type": "夏秋兼用", "taste": "甘味・酸味穏やか", "size": "大", "ease": 5, "rarity": 1, "demand": 5, "gift": 3, "rain": 4, "confidence": "A", "note": "千葉県の主力。収量・大果・店もち・輸送性に優れ市場性が高い。", "commercial": 3.8}, {"name": "蓬莱柿", "alias": "日本いちじく", "color": "赤紫〜褐色", "season": "中生", "type": "秋果中心", "taste": "在来系の風味", "size": "大", "ease": 4, "rarity": 2, "demand": 4, "gift": 4, "rain": 3, "confidence": "A", "note": "古くから栽培される在来系。樹勢が強い。", "commercial": 3.6}, {"name": "ホワイトゼノア", "alias": "White Genoa", "color": "緑〜黄緑", "season": "中生", "type": "秋果", "taste": "甘味・酸味が強め", "size": "中", "ease": 4, "rarity": 3, "demand": 4, "gift": 4, "rain": 3, "confidence": "A", "note": "桝井ドーフィンより小果だが食味が良い。", "commercial": 3.6}, {"name": "セレスト", "alias": "Celeste", "color": "紫褐色", "season": "早生", "type": "秋果", "taste": "非常に甘くねっとり", "size": "小", "ease": 4, "rarity": 4, "demand": 4, "gift": 4, "rain": 3, "confidence": "A", "note": "小果で皮ごと食べやすい。", "commercial": 3.8}, {"name": "ビオレ・ソリエス", "alias": "Violette de Solliès", "color": "濃紫〜黒", "season": "晩生", "type": "秋果", "taste": "高糖度・酸味・濃厚", "size": "中〜小", "ease": 3, "rarity": 4, "demand": 5, "gift": 5, "rain": 2, "confidence": "A", "note": "高糖度で食味・ギフト性が高いが、小果・晩生。", "commercial": 3.9}, {"name": "バローネ", "alias": "Barone", "color": "緑黄色", "season": "中生〜晩生", "type": "秋果", "taste": "甘く高糖度", "size": "大", "ease": 4, "rarity": 4, "demand": 4, "gift": 5, "rain": 2, "confidence": "A", "note": "直売向き有望品種。果皮が柔らかく輸送性に弱点。", "commercial": 4.1}, {"name": "ブルンスウィック", "alias": "Brunswick", "color": "橙〜赤", "season": "中生", "type": "秋果", "taste": "食べやすい", "size": "中", "ease": 4, "rarity": 4, "demand": 3, "gift": 4, "rain": 3, "confidence": "A", "note": "着果数が多く豊産。耐寒性がやや強い。", "commercial": 3.5}, {"name": "ザ・キング", "alias": "Desert King / King", "color": "緑", "season": "早生", "type": "サンペドロ系", "taste": "濃厚・高品質の夏果", "size": "大", "ease": 3, "rarity": 5, "demand": 4, "gift": 5, "rain": 3, "confidence": "B", "note": "夏果が大きな魅力。秋果は地域・条件による。", "commercial": 4.2}, {"name": "ゴールデンリバーサイド", "alias": "UCR 278-128 / DFIC 25", "color": "黄〜黄金", "season": "中生", "type": "Common", "taste": "ハニー系", "size": "大", "ease": 4, "rarity": 5, "demand": 4, "gift": 5, "rain": 3, "confidence": "B", "note": "UCR 278-128との同一性情報あり。海外DBでは自家結実性・大果。", "commercial": 4.3}, {"name": "Golden Rainbow", "alias": "Ben's Golden Riverside / BGR", "color": "黄金", "season": "早生", "type": "Common", "taste": "ハニー系", "size": "大", "ease": 5, "rarity": 5, "demand": 4, "gift": 5, "rain": 3, "confidence": "B", "note": "Golden Riversideと混同されやすく別系統として管理。", "commercial": 4.5}, {"name": "ブラウンターキー", "alias": "Brown Turkey", "color": "茶〜紫", "season": "中生", "type": "Common", "taste": "甘味系", "size": "中", "ease": 5, "rarity": 3, "demand": 4, "gift": 4, "rain": 3, "confidence": "B", "note": "広く知られる品種名だが系統差に注意。", "commercial": 3.8}, {"name": "ブラックミッション", "alias": "Black Mission", "color": "黒紫", "season": "中生", "type": "Common", "taste": "ベリー系・濃厚", "size": "中", "ease": 4, "rarity": 3, "demand": 5, "gift": 5, "rain": 2, "confidence": "B", "note": "知名度が高く色・風味で差別化しやすい。", "commercial": 3.9}, {"name": "カドタ", "alias": "Kadota", "color": "緑〜黄緑", "season": "中生", "type": "Common", "taste": "ハニー系", "size": "中", "ease": 4, "rarity": 3, "demand": 4, "gift": 4, "rain": 3, "confidence": "B", "note": "黄緑系の代表的品種。加工にも利用。", "commercial": 3.6}, {"name": "アドリアティック", "alias": "Adriatic", "color": "緑", "season": "中生", "type": "Common", "taste": "ベリー系", "size": "中", "ease": 4, "rarity": 4, "demand": 4, "gift": 5, "rain": 2, "confidence": "B", "note": "緑皮＋赤系果肉で色のコントラストが強い。", "commercial": 3.9}, {"name": "イスキアブラック", "alias": "Black Ischia", "color": "濃紫", "season": "中生", "type": "Common", "taste": "ベリー系", "size": "中", "ease": 4, "rarity": 4, "demand": 4, "gift": 5, "rain": 3, "confidence": "B", "note": "黒系でコレクター・直売向き。", "commercial": 4.0}, {"name": "グリーンイスキア", "alias": "Green Ischia", "color": "緑", "season": "中生", "type": "Common", "taste": "ベリー〜ハニー", "size": "中", "ease": 4, "rarity": 4, "demand": 3, "gift": 5, "rain": 3, "confidence": "B", "note": "緑皮で詰め合わせ向き。", "commercial": 3.7}, {"name": "LSU Purple", "alias": "LSU Purple", "color": "紫", "season": "早生〜中生", "type": "Common", "taste": "甘味・ベリー系", "size": "中", "ease": 5, "rarity": 4, "demand": 4, "gift": 4, "rain": 3, "confidence": "B", "note": "米国改良系。家庭・直売向き候補。", "commercial": 4.0}, {"name": "LSU Gold", "alias": "LSU Gold", "color": "黄〜黄緑", "season": "中生", "type": "Common", "taste": "ハニー系", "size": "中〜大", "ease": 5, "rarity": 4, "demand": 4, "gift": 5, "rain": 3, "confidence": "B", "note": "黄色系で詰め合わせの色差を出しやすい。", "commercial": 4.3}, {"name": "Longue d'Aout", "alias": "Longue d'Aout", "color": "緑〜紫", "season": "中生", "type": "Common", "taste": "甘味系", "size": "大", "ease": 4, "rarity": 4, "demand": 4, "gift": 5, "rain": 3, "confidence": "B", "note": "細長い果形で外観差を出しやすい。", "commercial": 4.2}, {"name": "Hative d'Argenteuil", "alias": "Hative", "color": "紫", "season": "中生", "type": "Common", "taste": "ベリー系", "size": "中", "ease": 4, "rarity": 5, "demand": 3, "gift": 5, "rain": 3, "confidence": "B", "note": "紫色とベリー系風味で差別化しやすい。", "commercial": 3.9}, {"name": "サンミシェル", "alias": "Saint Michel", "color": "濃紫〜黒", "season": "中生〜晩生", "type": "Common", "taste": "濃厚ベリー系", "size": "小〜中", "ease": 3, "rarity": 5, "demand": 4, "gift": 5, "rain": 2, "confidence": "C", "note": "国内農園で高糖度・濃厚風味の紹介例あり。データ蓄積が必要。", "commercial": 3.9}, {"name": "セレストブルー", "alias": "Blue Celeste", "color": "青紫", "season": "早生", "type": "秋果", "taste": "ねっとり甘い", "size": "小", "ease": 4, "rarity": 4, "demand": 3, "gift": 4, "rain": 3, "confidence": "B", "note": "国内流通情報が限定的。名称・系統の同定に注意。", "commercial": 3.5}, {"name": "Pakistan", "alias": "Pakistan Fig", "color": "緑〜紫", "season": "不定", "type": "要確認", "taste": "甘味系", "size": "非常に大", "ease": 3, "rarity": 5, "demand": 4, "gift": 5, "rain": 2, "confidence": "C", "note": "通称が複数系統に使われるため由来確認が重要。", "commercial": 4.1}, {"name": "Pakistan Mulberry Fig", "alias": "パキスタン系・通称", "color": "緑〜紫", "season": "不定", "type": "要確認", "taste": "品種差あり", "size": "大", "ease": 3, "rarity": 5, "demand": 3, "gift": 4, "rain": 2, "confidence": "C", "note": "通称・流通名が多く、品種同定を要する。", "commercial": 3.7}];
const $=id=>document.getElementById(id);
function stars(n){return "★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n))}
function render(){let q=$("q").value.trim().toLowerCase(),s=$("season").value,c=$("color").value,sort=$("sort").value;
let a=DATA.filter(v=>(!q||(v.name+" "+v.alias).toLowerCase().includes(q))&&(!s||v.season.includes(s))&&(!c||v.color.includes(c)));
a.sort((x,y)=>sort==="name"?x.name.localeCompare(y.name,"ja"):y[sort]-x[sort]);$("count").textContent=a.length;
$("grid").innerHTML=a.map(v=>`<article class="card" onclick="openModal(${DATA.indexOf(v)})"><h2>${v.name}</h2><div class="alias">${v.alias}</div>
<div class="badges"><span class="badge">${v.color}</span><span class="badge">${v.season}</span><span class="badge">${v.type}</span><span class="badge">信頼度 ${v.confidence}</span></div>
<div class="score">商業ポテンシャル <b>${v.commercial}/5</b></div><div class="bar"><div class="fill" style="width:${v.commercial/5*100}%"></div></div>
<div class="score">希少性 ${stars(v.rarity)}　育てやすさ ${stars(v.ease)}</div><div class="score">市場需要 ${stars(v.demand)}　ギフト ${stars(v.gift)}</div><div class="note">${v.note}</div></article>`).join("")||"<p>該当なし</p>"}
function openModal(i){let v=DATA[i];$("detail").innerHTML=`<h2>${v.name}</h2><small>${v.alias}</small>
<div class="row"><b>商業ポテンシャル</b><b>${v.commercial}/5</b></div><div class="row"><b>希少性</b><span>${stars(v.rarity)}</span></div>
<div class="row"><b>育てやすさ</b><span>${stars(v.ease)}</span></div><div class="row"><b>市場需要</b><span>${stars(v.demand)}</span></div>
<div class="row"><b>ギフト適性</b><span>${stars(v.gift)}</span></div><div class="row"><b>雨への強さ</b><span>${stars(v.rain)}</span></div>
<div class="row"><b>色</b><span>${v.color}</span></div><div class="row"><b>収穫時期</b><span>${v.season}</span></div>
<div class="row"><b>タイプ</b><span>${v.type}</span></div><div class="row"><b>食味</b><span>${v.taste}</span></div>
<div class="row"><b>果実サイズ</b><span>${v.size}</span></div><div class="row"><b>信頼度</b><span>${v.confidence}</span></div><p class="note">${v.note}</p>`;
$("modal").classList.add("on")}
function closeModal(){$("modal").classList.remove("on")}function resetFilters(){$("q").value="";$("season").value="";$("color").value="";$("sort").value="commercial";render()}
["q","season","color","sort"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",render));render();
</script></body></html>
